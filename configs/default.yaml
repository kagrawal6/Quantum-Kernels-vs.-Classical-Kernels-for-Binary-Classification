# Default experiment settings
# Edit this file (or copy it) instead of hardcoding values in scripts.

datasets:
  - breast_cancer
  # - mnist_binary  # e.g. digits 0 vs 1; enable after loader is ready

preprocess:
  method: pca          # pca | select_k
  n_features: 4        # keep small for NISQ / qubit limits
  test_size: 0.2
  random_state: 42
  scale: true

classical:
  linear:
    C: 1.0
  rbf:
    C: 1.0
    gamma: scale

quantum:
  feature_map: zz      # z | zz
  n_qubits: 4          # usually matches n_features
  reps: 1              # circuit depth / repetitions
  shots: 1024
  backend: aer_simulator  # aer_simulator | ibm_hardware (later)

experiment:
  metrics: [accuracy, f1]
  vary:
    n_features: [2, 4, 6, 8]
    train_sizes: [0.2, 0.5, 1.0]
    shots: [256, 1024, 4096]
